<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ahtapot Yakala — A: Derin Deniz</title>
<style>
  :root {
    --lacivert-900: #0b1f38;
    --lacivert-800: #0f2a4a;
    --lacivert-600: #1b4d7a;
    --turuncu: #ff7a59;
    --turuncu-koyu: #e8603f;
    --beyaz: #ffffff;
    --soluk: rgba(255,255,255,.72);
    --hucre: rgba(255,255,255,.07);
    --hucre-kenar: rgba(255,255,255,.12);
    --sahne: #e7ecf2;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--sahne); font-family: var(--font); color: #24364d; padding: 32px 16px; }
  .sahne { display: flex; flex-wrap: wrap; gap: 32px; justify-content: center; }
  .kare { width: 100%; max-width: 390px; }
  .etiket { font-size: 14px; font-weight: 600; margin-bottom: 10px; color: #4a5d75; }

  .ekran {
    position: relative; height: 844px; border-radius: 28px; overflow: hidden;
    color: var(--beyaz);
    background: radial-gradient(120% 70% at 50% 0%, var(--lacivert-600) 0%, var(--lacivert-800) 60%, var(--lacivert-900) 100%);
    display: flex; flex-direction: column; padding: 56px 24px 36px;
    touch-action: manipulation; user-select: none;
    box-shadow: 0 24px 60px rgba(15,42,74,.25);
  }
  .btn {
    display: block; width: 100%; padding: 18px; border: 0; border-radius: 16px;
    font: 700 18px/1 var(--font); text-align: center; color: var(--beyaz);
    background: var(--turuncu); box-shadow: 0 10px 28px rgba(255,122,89,.35);
  }

  /* Başlangıç */
  .baslangic { justify-content: space-between; text-align: center; align-items: center; }
  .hero { margin-top: 90px; display: flex; flex-direction: column; align-items: center; gap: 18px; }
  .logo { width: 132px; height: 132px; border-radius: 38px; display: grid; place-items: center;
    background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.14); box-shadow: 0 20px 50px rgba(0,0,0,.35); }
  h1 { font-size: 40px; font-weight: 800; letter-spacing: -0.02em; }
  .aciklama { font-size: 17px; line-height: 1.5; color: var(--soluk); max-width: 290px; }
  .rozet { display: inline-flex; gap: 8px; align-items: center; padding: 8px 14px; border-radius: 999px;
    background: rgba(255,255,255,.08); font-size: 15px; color: var(--soluk); }
  .rozet b { color: var(--beyaz); }
  .alt { width: 100%; display: flex; flex-direction: column; gap: 14px; }
  .ipucu { font-size: 14px; color: var(--soluk); }

  /* Oyun */
  .ust { display: flex; justify-content: space-between; align-items: flex-end; }
  .sayac small { display: block; font-size: 13px; color: var(--soluk); margin-bottom: 4px; letter-spacing: .04em; }
  .sayac strong { font-size: 40px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .sayac.sag { text-align: right; }
  .cubuk { margin-top: 16px; height: 8px; border-radius: 99px; background: rgba(255,255,255,.1); overflow: hidden; }
  .cubuk span { display: block; height: 100%; width: 60%; border-radius: 99px; background: var(--turuncu); }
  .izgara { margin-top: 64px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .hucre { aspect-ratio: 1; border-radius: 22px; background: var(--hucre); border: 1px solid var(--hucre-kenar);
    display: grid; place-items: center; position: relative; }
  .hucre.dolu { background: rgba(255,122,89,.14); border-color: rgba(255,122,89,.55); box-shadow: 0 0 0 4px rgba(255,122,89,.12); }
  .arti { position: absolute; top: 6px; right: 10px; font-weight: 800; font-size: 18px; color: var(--turuncu); }
  .hucre.vurdu { background: rgba(255,255,255,.12); }
  .oyun .ipucu { margin-top: auto; text-align: center; }

  /* Bitiş */
  .bitis { justify-content: space-between; text-align: center; align-items: center; }
  .sonuc { margin-top: 110px; display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .sonuc .baslik { font-size: 20px; color: var(--soluk); font-weight: 600; }
  .buyuk { font-size: 112px; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
  .buyuk + p { font-size: 17px; color: var(--soluk); }
  .kartlar { display: flex; gap: 12px; margin-top: 28px; }
  .kart { width: 140px; padding: 14px; border-radius: 16px; background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.12); }
  .kart small { display: block; font-size: 13px; color: var(--soluk); margin-bottom: 6px; }
  .kart strong { font-size: 28px; font-weight: 800; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="ahtapot" viewBox="0 0 100 100">
    <g fill="#ff7a59">
      <ellipse cx="50" cy="38" rx="26" ry="24"/>
      <path d="M28 50 q-6 22 -18 26 q10 2 18 -8 q2 14 -6 24 q12 -4 16 -20 q0 14 4 22 q6 -10 4 -22 q4 14 12 20 q2 -12 -4 -22 q8 14 18 16 q-6 -10 -4 -22 q8 10 18 8 q-12 -4 -16 -26 z"/>
    </g>
    <circle cx="41" cy="36" r="5" fill="#fff"/><circle cx="59" cy="36" r="5" fill="#fff"/>
    <circle cx="42" cy="37" r="2.4" fill="#0f2a4a"/><circle cx="60" cy="37" r="2.4" fill="#0f2a4a"/>
  </symbol>
</svg>

<div class="sahne">
  <!-- 1. Başlangıç -->
  <div class="kare">
    <div class="etiket">1 · Başlangıç</div>
    <section class="ekran baslangic">
      <div class="hero">
        <div class="logo"><svg width="88" height="88"><use href="#ahtapot"/></svg></div>
        <h1>Ahtapot Yakala</h1>
        <p class="aciklama">30 saniyen var. Ahtapot nerede belirirse oraya dokun!</p>
        <span class="rozet">🏆 En iyi skorun: <b>27</b></span>
      </div>
      <div class="alt">
        <button class="btn" data-testid="basla">Başla</button>
        <p class="ipucu">Boş kareye dokunmanın cezası yok.</p>
      </div>
    </section>
  </div>

  <!-- 2. Oyun -->
  <div class="kare">
    <div class="etiket">2 · Oyun</div>
    <section class="ekran oyun">
      <div class="ust">
        <div class="sayac"><small>SKOR</small><strong data-testid="skor">12</strong></div>
        <div class="sayac sag"><small>KALAN SÜRE</small><strong data-testid="sure">18</strong></div>
      </div>
      <div class="cubuk"><span></span></div>
      <div class="izgara">
        <div class="hucre" data-testid="hucre-0"></div>
        <div class="hucre vurdu" data-testid="hucre-1"><span class="arti">+1</span></div>
        <div class="hucre" data-testid="hucre-2"></div>
        <div class="hucre" data-testid="hucre-3"></div>
        <div class="hucre" data-testid="hucre-4"></div>
        <div class="hucre dolu" data-testid="hucre-5"><svg width="76" height="76"><use href="#ahtapot"/></svg></div>
        <div class="hucre" data-testid="hucre-6"></div>
        <div class="hucre" data-testid="hucre-7"></div>
        <div class="hucre" data-testid="hucre-8"></div>
      </div>
      <p class="ipucu">Ahtapota dokun!</p>
    </section>
  </div>

  <!-- 3. Bitiş -->
  <div class="kare">
    <div class="etiket">3 · Bitiş</div>
    <section class="ekran bitis">
      <div class="sonuc">
        <p class="baslik">Süre doldu!</p>
        <div class="buyuk" data-testid="skor">23</div>
        <p>ahtapot yakaladın</p>
        <div class="kartlar">
          <div class="kart"><small>En iyi skor</small><strong data-testid="en-iyi">27</strong></div>
          <div class="kart"><small>Rekora kalan</small><strong>4</strong></div>
        </div>
      </div>
      <div class="alt">
        <button class="btn" data-testid="tekrar-oyna">Tekrar oyna</button>
      </div>
    </section>
  </div>
</div>
</body>
</html>
